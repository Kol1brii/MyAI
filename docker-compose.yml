version: '3.9'

services:

  ds2api:
    image: ghcr.io/cjackhwang/ds2api:latest
    container_name: myai_ds2api
    environment:
      - DS2API_ADMIN_KEY=${DS2API_ADMIN_KEY}
      - DS2API_CONFIG_JSON=${DS2API_CONFIG_JSON}
    restart: unless-stopped

  api:
    build: .
    container_name: myai_backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - ds2api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myai_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped