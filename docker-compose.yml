services:

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - ds2api
    restart: unless-stopped

  ds2api:
    image: ghcr.io/cjackhwang/ds2api:latest
    environment:
      - DS2API_ADMIN_KEY=${DS2API_ADMIN_KEY}
      - DS2API_CONFIG_JSON=${DS2API_CONFIG_JSON}
    restart: unless-stopped




